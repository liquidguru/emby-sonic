# NEVER put LIQUIDWAVE_RELEASE_* signing values in this file — it is TRACKED IN
# GIT. Gradle reads project-level properties too, so a password pasted here
# would be committed and pushed. They belong in ~/.gradle/gradle.properties or
# environment variables, outside the repo. See README -> Release build.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
