<div is="emby-scroller" class="view flex flex-direction-column scrollFrameY flex-grow"
     data-horizontal="false" data-forcescrollbar="true" data-centerfocus="true"
     data-bindheader="true" data-title="Emby Sonic"
     data-controller="__plugin/embysonicconfigjs">
    <div class="scrollSlider flex-grow flex-direction-column padded-left padded-left-page padded-right padded-top-page padded-bottom-page settingsContainer">
        <form class="embysonicConfigForm auto-center">

            <div class="inputContainer">
                <input is="emby-input" type="text" class="txtServiceUrl" label="Python Service URL" autocomplete="off" />
                <div class="fieldDescription">
                    URL of the Emby Sonic Python coordinator service. Default: <code>http://localhost:8765</code>.
                    For NAS users running the coordinator on another host, enter that host's address
                    (e.g. <code>http://192.168.1.9:8765</code>).
                </div>
            </div>

            <div class="sonicStatus" style="margin:1.5em 0; padding:1em; background:#1a1a1a; border-radius:4px;">
                Checking service status...
            </div>

            <button is="emby-button" type="submit" class="raised button-submit block"><span>Save</span></button>
            <button is="emby-button" type="button" class="btnBuildMixes raised block"><span>Rebuild Mixes</span></button>
            <button is="emby-button" type="button" class="btnScan raised block"><span>Trigger Library Scan</span></button>
        </form>
    </div>
</div>
